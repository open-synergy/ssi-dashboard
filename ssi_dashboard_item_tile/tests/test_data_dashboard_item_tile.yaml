scenarios:
  - name: "Create Tile Item on an ORM-sourced Dashboard"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Create ORM data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DASH-TILE-DS-01"
          type: "orm"
          model_id: "REC: res_partner_model.id"
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Tile Dashboard"
          code: "DASH-TILE-01"
      - step: "Create tile item"
        action: "create"
        model: "dashboard.item"
        save_as: "item"
        values:
          name: "Partner Count"
          dashboard_id: "REC: dashboard.id"
          type: "tile"
          data_source_id: "REC: data_source.id"
      - step: "Assert item type is tile"
        action: "assert"
        target: "item"
        asserts:
          type:
            type: "value"
            expected: "tile"

  - name: "Rendering a Tile Item With Invalid Config JSON Raises UserError"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Create ORM data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DASH-TILE-DS-02"
          type: "orm"
          model_id: "REC: res_partner_model.id"
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Tile Dashboard"
          code: "DASH-TILE-02"
      - step: "Create tile item with invalid config"
        action: "create"
        model: "dashboard.item"
        save_as: "item"
        values:
          name: "Broken Tile"
          dashboard_id: "REC: dashboard.id"
          type: "tile"
          data_source_id: "REC: data_source.id"
          config: "{not valid json"
      - step: "Rendering payload raises UserError"
        action: "call"
        target: "item"
        method: "_prepare_render_payload"
        expect_error:
          type: "UserError"
