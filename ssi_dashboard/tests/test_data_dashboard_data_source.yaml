scenarios:
  - name: "Create Data Source"
    steps:
      - step: "Create data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Generic Source"
          code: "DS-CREATE-01"
      - step: "Assert created"
        action: "assert"
        target: "data_source"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Generic Source"

  - name: "Edit Data Source Name"
    steps:
      - step: "Create data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Generic Source"
          code: "DS-EDIT-01"
      - step: "Write new name"
        action: "write"
        target: "data_source"
        values:
          name: "Generic Source v2"
      - step: "Assert name updated"
        action: "assert"
        target: "data_source"
        asserts:
          name:
            type: "value"
            expected: "Generic Source v2"

  - name: "Delete Data Source"
    steps:
      - step: "Create data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Temporary"
          code: "DS-DELETE-01"
      - step: "Delete data source"
        action: "unlink"
        target: "data_source"
      - step: "Verify deleted"
        action: "search"
        model: "dashboard.data_source"
        domain: [["code", "=", "DS-DELETE-01"]]
        save_as: "result"
        expect_count: 0

  - name: "Create ORM Data Source targeting res.partner"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Create ORM data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DS-ORM-01"
          type: "orm"
          model_id: "REC: res_partner_model.id"
      - step: "Assert type and model"
        action: "assert"
        target: "data_source"
        asserts:
          type:
            type: "value"
            expected: "orm"
          model_id:
            type: "m2o"
            expected: "REC: res_partner_model"

  - name: "Create Data Source Without Aggregate Or Limit Uses Defaults"
    steps:
      - step: "Create data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Generic Source"
          code: "DS-DEFAULT-01"
      - step: "Assert aggregate defaults to count and limit to zero"
        action: "assert"
        target: "data_source"
        asserts:
          aggregate:
            type: "value"
            expected: "count"
          limit:
            type: "value"
            expected: 0

  - name: "Changing Model Clears Measure And Group By Field"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "model_a"
      - step: "Get res.users model"
        action: "ref"
        xml_id: "base.model_res_users"
        save_as: "model_b"
      - step: "Find a numeric field on res.partner"
        action: "search"
        model: "ir.model.fields"
        domain:
          [
            ["model", "=", "res.partner"],
            ["ttype", "in", ["integer", "float", "monetary"]],
          ]
        save_as: "numeric_field_a"
        limit: 1
      - step: "Find any field on res.partner"
        action: "search"
        model: "ir.model.fields"
        domain: [["model", "=", "res.partner"]]
        save_as: "any_field_a"
        limit: 1
      - step: "Fill form and set model_id, measure and group by on model A"
        action: "form"
        model: "dashboard.data_source"
        save_as: "data_source"
        save: true
        ops:
          - set: {name: "Form Data Source"}
          - set: {code: "DS-FORM-01"}
          - set: {type: "orm"}
          - set: {model_id: "REC: model_a"}
          - set: {measure_field_id: "REC: numeric_field_a"}
          - set: {group_by_field_id: "REC: any_field_a"}
          - set: {model_id: "REC: model_b"}
          - assert:
              measure_field_id:
                type: "value"
                operator: "is_falsy"
              group_by_field_id:
                type: "value"
                operator: "is_falsy"

  - name: "Invalid Aggregate Value Is Rejected"
    steps:
      - step: "Create data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Generic Source"
          code: "DS-BADAGG-01"
      - step: "Write invalid aggregate value"
        action: "write"
        target: "data_source"
        expect_error:
          type: "ValueError"
        values:
          aggregate: "median"

  - name: "Selecting Date Field Keeps Granularity, Non-Date Clears It"
    steps:
      - step: "Get res.currency.rate model"
        action: "ref"
        xml_id: "base.model_res_currency_rate"
        save_as: "model_a"
      - step: "Find the 'name' (date) field on res.currency.rate"
        action: "search"
        model: "ir.model.fields"
        domain: [["model", "=", "res.currency.rate"], ["name", "=", "name"]]
        save_as: "date_field"
        limit: 1
      - step: "Find the 'rate' (non-date) field on res.currency.rate"
        action: "search"
        model: "ir.model.fields"
        domain: [["model", "=", "res.currency.rate"], ["name", "=", "rate"]]
        save_as: "non_date_field"
        limit: 1
      - step: "Fill form: date field keeps a set granularity, non-date clears it"
        action: "form"
        model: "dashboard.data_source"
        save_as: "data_source"
        save: true
        ops:
          - set: {name: "Form Granularity Source"}
          - set: {code: "DS-GRAN-FORM-01"}
          - set: {type: "orm"}
          - set: {model_id: "REC: model_a"}
          - set: {group_by_field_id: "REC: date_field"}
          - set: {group_by_granularity: "year"}
          - assert:
              group_by_granularity:
                type: "value"
                expected: "year"
          - set: {group_by_field_id: "REC: non_date_field"}
          - assert:
              group_by_granularity:
                type: "value"
                operator: "is_falsy"

  - name: "Fetch Data Without Model Configured Is Rejected"
    steps:
      - step: "Create data source without a target model"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "No Model Source"
          code: "DS-NOMODEL-01"
          type: "orm"
      - step: "Fetching data without a target model raises UserError"
        action: "call"
        target: "data_source"
        method: "_fetch_data"
        args:
          - "REC: data_source"
        expect_error:
          type: "UserError"

  - name: "Invalid Group By Granularity Value Is Rejected"
    steps:
      - step: "Create data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Generic Source"
          code: "DS-BADGRAN-01"
      - step: "Write invalid granularity value"
        action: "write"
        target: "data_source"
        expect_error:
          type: "ValueError"
        values:
          group_by_granularity: "decade"

  - name: "Create Measure With Aggregate Count And No Field Is Allowed"
    steps:
      - step: "Create data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Generic Source"
          code: "DS-MEASURE-COUNT-01"
      - step: "Create measure with aggregate count and no field"
        action: "create"
        model: "dashboard.data_source.measure"
        save_as: "measure"
        values:
          data_source_id: "REC: data_source.id"
          aggregate: "count"
          name: "Total"
      - step: "Assert measure created without a field"
        action: "assert"
        target: "measure"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          field_id:
            type: "value"
            operator: "is_falsy"

  - name: "Create Measure With Aggregate Sum And No Field Is Rejected"
    steps:
      - step: "Create data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Generic Source"
          code: "DS-MEASURE-NOFIELD-01"
      - step: "Create measure sum without field is rejected"
        action: "create"
        model: "dashboard.data_source.measure"
        expect_error:
          type: "ValidationError"
        values:
          data_source_id: "REC: data_source.id"
          aggregate: "sum"
          name: "Total"

  - name: "Create Measure With Non Numeric Field Is Rejected"
    steps:
      - step: "Create data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Generic Source"
          code: "DS-MEASURE-BADTYPE-01"
      - step: "Find a char field on res.partner"
        action: "search"
        model: "ir.model.fields"
        domain: [["model", "=", "res.partner"], ["name", "=", "name"]]
        save_as: "char_field"
        limit: 1
      - step: "Create measure sum with char field is rejected"
        action: "create"
        model: "dashboard.data_source.measure"
        expect_error:
          type: "ValidationError"
        values:
          data_source_id: "REC: data_source.id"
          aggregate: "sum"
          field_id: "REC: char_field.id"
          name: "Total"
