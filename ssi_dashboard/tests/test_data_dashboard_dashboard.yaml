scenarios:
  - name: "Create Dashboard"
    steps:
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Sales Overview"
          code: "DASH-CREATE-01"
      - step: "Assert created"
        action: "assert"
        target: "dashboard"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Sales Overview"

  - name: "Edit Dashboard Name"
    steps:
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Sales Overview"
          code: "DASH-EDIT-01"
      - step: "Write new name"
        action: "write"
        target: "dashboard"
        values:
          name: "Sales Overview v2"
      - step: "Assert name updated"
        action: "assert"
        target: "dashboard"
        asserts:
          name:
            type: "value"
            expected: "Sales Overview v2"

  - name: "Delete Dashboard"
    steps:
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Temporary"
          code: "DASH-DELETE-01"
      - step: "Delete dashboard"
        action: "unlink"
        target: "dashboard"
      - step: "Verify deleted"
        action: "search"
        model: "dashboard.dashboard"
        domain: [["code", "=", "DASH-DELETE-01"]]
        save_as: "result"
        expect_count: 0

  - name: "Create Dashboard with Items"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Create data source for items"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DASH-ITEMS-DS-01"
          type: "orm"
          model_id: "REC: res_partner_model.id"
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Two Items"
          code: "DASH-ITEMS-01"
      - step: "Create item with sequence 20"
        action: "create"
        model: "dashboard.item"
        save_as: "item_20"
        values:
          name: "Item A"
          dashboard_id: "REC: dashboard.id"
          sequence: 20
          type: "placeholder"
          data_source_id: "REC: data_source.id"
      - step: "Create item with sequence 10"
        action: "create"
        model: "dashboard.item"
        save_as: "item_10"
        values:
          name: "Item B"
          dashboard_id: "REC: dashboard.id"
          sequence: 10
          type: "placeholder"
          data_source_id: "REC: data_source.id"
      - step: "Assert two items"
        action: "assert"
        target: "dashboard"
        asserts:
          item_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

  - name: "Dashboard References Its Color Scheme"
    steps:
      - step: "Create color scheme"
        action: "create"
        model: "dashboard.color_scheme"
        save_as: "color_scheme"
        values:
          name: "Ocean"
          code: "DASH-CS-REF-01"
      - step: "Create dashboard with color scheme"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Styled Dashboard"
          code: "DASH-CS-REF-DASH-01"
          color_scheme_id: "REC: color_scheme.id"
      - step: "Assert color scheme reference"
        action: "assert"
        target: "dashboard"
        asserts:
          color_scheme_id:
            type: "m2o"
            expected: "REC: color_scheme"

  - name: "Reading Dashboard Without Dashboard Group Is Denied"
    steps:
      - step: "Create user without dashboard access"
        action: "create"
        model: "res.users"
        save_as: "restricted_user"
        values:
          name: "No Dashboard Access"
          login: "no-dashboard-access@example.com"
          group_ids: [[6, 0, ["REF: base.group_user"]]]
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Restricted Dashboard"
          code: "DASH-ACCESS-01"
      - step: "Restricted user cannot read dashboard"
        action: "call"
        target: "dashboard"
        method: "read"
        args:
          - ["name"]
        as_user: "restricted_user"
        expect_error:
          type: "AccessError"

  - name: "Generate Menu Creates Menu And Client Action"
    steps:
      - step: "Create dashboard with generate_menu enabled"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Menu Enabled Dashboard"
          code: "DASH-MENU-CREATE-01"
          generate_menu: true
          parent_menu_id: "ssi_dashboard.menu_dashboard_configuration"
      - step: "Assert menu and client action generated"
        action: "assert"
        target: "dashboard"
        asserts:
          menu_id:
            type: "value"
            operator: "is_truthy"
          client_action_id:
            type: "value"
            operator: "is_truthy"
          menu_id.name:
            type: "value"
            expected: "Menu Enabled Dashboard"
          menu_id.parent_id:
            type: "m2o"
            expected_xml_id: "ssi_dashboard.menu_dashboard_configuration"
          menu_id.sequence:
            type: "value"
            expected: 10
          client_action_id.tag:
            type: "value"
            expected: "ssi_dashboard.dashboard_view"

  - name: "Generate Menu Disabled Produces No Menu"
    steps:
      - step: "Create dashboard with generate_menu left at default"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Menu Disabled Dashboard"
          code: "DASH-MENU-NONE-01"
      - step: "Assert no menu or client action generated"
        action: "assert"
        target: "dashboard"
        asserts:
          menu_id:
            type: "value"
            operator: "is_falsy"
          client_action_id:
            type: "value"
            operator: "is_falsy"

  - name: "Renaming Dashboard Updates Generated Menu Name"
    steps:
      - step: "Create dashboard with generate_menu enabled"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Old Name"
          code: "DASH-MENU-RENAME-01"
          generate_menu: true
          parent_menu_id: "ssi_dashboard.menu_dashboard_configuration"
      - step: "Rename dashboard"
        action: "write"
        target: "dashboard"
        values:
          name: "New Name"
      - step: "Assert generated menu name follows dashboard name"
        action: "assert"
        target: "dashboard"
        asserts:
          menu_id.name:
            type: "value"
            expected: "New Name"

  - name: "Disabling Generate Menu Removes Menu And Client Action"
    steps:
      - step: "Create dashboard with generate_menu enabled"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Disable Me"
          code: "DASH-MENU-DISABLE-01"
          menu_name: "Disable Me Menu"
          generate_menu: true
          parent_menu_id: "ssi_dashboard.menu_dashboard_configuration"
      - step: "Assert menu generated before disabling"
        action: "assert"
        target: "dashboard"
        asserts:
          menu_id:
            type: "value"
            operator: "is_truthy"
      - step: "Disable generate_menu"
        action: "write"
        target: "dashboard"
        values:
          generate_menu: false
      - step: "Assert menu and client action cleared from dashboard"
        action: "assert"
        target: "dashboard"
        asserts:
          menu_id:
            type: "value"
            operator: "is_falsy"
          client_action_id:
            type: "value"
            operator: "is_falsy"
      - step: "Verify generated menu no longer exists"
        action: "search"
        model: "ir.ui.menu"
        domain: [["name", "=", "Disable Me Menu"]]
        save_as: "leftover_menu"
        expect_count: 0

  - name: "Deleting Dashboard Removes Generated Menu And Client Action"
    steps:
      - step: "Create dashboard with generate_menu enabled"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Delete Me"
          code: "DASH-MENU-DELETE-01"
          menu_name: "Delete Me Menu"
          generate_menu: true
          parent_menu_id: "ssi_dashboard.menu_dashboard_configuration"
      - step: "Assert menu generated before deleting"
        action: "assert"
        target: "dashboard"
        asserts:
          menu_id:
            type: "value"
            operator: "is_truthy"
      - step: "Delete dashboard"
        action: "unlink"
        target: "dashboard"
      - step: "Verify generated menu no longer exists"
        action: "search"
        model: "ir.ui.menu"
        domain: [["name", "=", "Delete Me Menu"]]
        save_as: "leftover_menu"
        expect_count: 0
      - step: "Verify generated client action no longer exists"
        action: "search"
        model: "ir.actions.client"
        domain:
          [
            ["name", "=", "Delete Me Menu"],
            ["tag", "=", "ssi_dashboard.dashboard_view"],
          ]
        save_as: "leftover_action"
        expect_count: 0

  - name: "Generated Menu Groups Mirror Dashboard Allowed Groups"
    steps:
      - step: "Get dashboard user group"
        action: "ref"
        xml_id: "ssi_dashboard.group_dashboard_user"
        save_as: "allowed_group"
      - step: "Create dashboard restricted to that group"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Group Mirrored Dashboard"
          code: "DASH-MENU-GROUPS-01"
          generate_menu: true
          parent_menu_id: "ssi_dashboard.menu_dashboard_configuration"
          group_ids: [[6, 0, ["REC: allowed_group.id"]]]
      - step: "Assert generated menu groups match dashboard allowed groups"
        action: "assert"
        target: "dashboard"
        asserts:
          menu_id.group_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: allowed_group"

  - name: "Generate Menu Without Parent Menu Is Rejected"
    steps:
      - step: "Create dashboard with generate_menu enabled but no parent"
        action: "create"
        model: "dashboard.dashboard"
        expect_error:
          type: "UserError"
        values:
          name: "Missing Parent"
          code: "DASH-MENU-NOPARENT-01"
          generate_menu: true

  - name: "Save Layout With Foreign Item Id Is Rejected"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Create data source for items"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DASH-SAVE-LAYOUT-FOREIGN-DS-01"
          type: "orm"
          model_id: "REC: res_partner_model.id"
      - step: "Create owning dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Owning Dashboard"
          code: "DASH-SAVE-LAYOUT-FOREIGN-01"
      - step: "Create item on owning dashboard"
        action: "create"
        model: "dashboard.item"
        save_as: "item"
        values:
          name: "Item A"
          dashboard_id: "REC: dashboard.id"
          type: "placeholder"
          data_source_id: "REC: data_source.id"
      - step: "Create another dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "other_dashboard"
        values:
          name: "Other Dashboard"
          code: "DASH-SAVE-LAYOUT-FOREIGN-02"
      - step: "Create item on the other dashboard"
        action: "create"
        model: "dashboard.item"
        save_as: "other_item"
        values:
          name: "Item B"
          dashboard_id: "REC: other_dashboard.id"
          type: "placeholder"
          data_source_id: "REC: data_source.id"
      - step: "Saving the other dashboard's item id must be rejected"
        action: "call"
        target: "dashboard"
        method: "save_layout"
        expect_error:
          type: "UserError"
        args:
          - - id: "REC: other_item.id"
              column_start: 0
              row_start: 0
              column_width: 4
              row_height: 1

  - name: "Creating Dashboard Defaults Refresh Interval To Off"
    steps:
      - step: "Create dashboard without setting refresh_interval"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Default Refresh Dashboard"
          code: "DASH-REFRESH-DEFAULT-01"
      - step: "Assert refresh_interval defaults to Off"
        action: "assert"
        target: "dashboard"
        asserts:
          refresh_interval:
            type: "value"
            expected: "0"

  - name: "Writing A Valid Refresh Interval Is Accepted"
    steps:
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Refresh Interval Dashboard"
          code: "DASH-REFRESH-WRITE-01"
      - step: "Write 30 minutes refresh interval"
        action: "write"
        target: "dashboard"
        values:
          refresh_interval: "1800"
      - step: "Assert refresh_interval saved"
        action: "assert"
        target: "dashboard"
        asserts:
          refresh_interval:
            type: "value"
            expected: "1800"

  - name: "Writing An Out Of Selection Refresh Interval Is Rejected"
    steps:
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Invalid Refresh Interval Dashboard"
          code: "DASH-REFRESH-INVALID-01"
      - step: "Write a value outside the selection must be rejected"
        action: "write"
        target: "dashboard"
        expect_error:
          type: "ValueError"
        values:
          refresh_interval: "5"

  - name: "Writing An Integer Refresh Interval Is Rejected"
    steps:
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Integer Refresh Interval Dashboard"
          code: "DASH-REFRESH-INT-01"
      - step: "Write an integer instead of a selection string must be rejected"
        action: "write"
        target: "dashboard"
        expect_error:
          type: "ValueError"
        values:
          refresh_interval: 300

  - name: "Creating Dashboard Defaults Fullscreen Enabled To True"
    steps:
      - step: "Create dashboard without setting fullscreen_enabled"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Default Fullscreen Dashboard"
          code: "DASH-FULLSCREEN-DEFAULT-01"
      - step: "Assert fullscreen_enabled defaults to True"
        action: "assert"
        target: "dashboard"
        asserts:
          fullscreen_enabled:
            type: "value"
            operator: "is_truthy"

  - name: "Creating Dashboard Without Company Defaults To Active Company"
    steps:
      - step: "Create dashboard without setting company_id"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Default Company Dashboard"
          code: "DASH-COMPANY-DEFAULT-01"
      - step: "Assert company_id defaults to the active company"
        action: "assert"
        target: "dashboard"
        asserts:
          company_id:
            type: "m2o"
            expected: "REC: company"

  - name: "User Sees Own Company And Company-less Dashboards But Not Another Company's"
    steps:
      - step: "Create a second company"
        action: "create"
        model: "res.company"
        save_as: "company_b"
        values:
          name: "Second Company"
      - step: "Create dashboard belonging to the active company"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard_own"
        values:
          name: "Own Company Dashboard"
          code: "DASH-COMPANY-MC-OWN-01"
          company_id: "REC: company.id"
      - step: "Create dashboard belonging to the second company"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard_other"
        values:
          name: "Other Company Dashboard"
          code: "DASH-COMPANY-MC-OTHER-01"
          company_id: "REC: company_b.id"
      - step: "Create dashboard with no company"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard_empty"
        values:
          name: "Company-less Dashboard"
          code: "DASH-COMPANY-MC-EMPTY-01"
          company_id: false
      - step: "Create a plain dashboard user"
        action: "create"
        model: "res.users"
        save_as: "company_user"
        values:
          name: "Company Scoped User"
          login: "company-scoped-user@example.com"
          group_ids:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_dashboard.group_dashboard_user"
      - step:
          "Searching with only the active company allowed finds only that company's and
          the company-less dashboard"
        action: "search"
        model: "dashboard.dashboard"
        domain:
          [
            [
              "code",
              "in",
              [
                "DASH-COMPANY-MC-OWN-01",
                "DASH-COMPANY-MC-OTHER-01",
                "DASH-COMPANY-MC-EMPTY-01",
              ],
            ],
          ]
        as_user: "company_user"
        context:
          allowed_company_ids: ["REC: company.id"]
        save_as: "visible_dashboards"
        expect_count: 2

  - name: "Save Layout By Non Admin User Is Rejected"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Create data source for items"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DASH-SAVE-LAYOUT-NONADMIN-DS-01"
          type: "orm"
          model_id: "REC: res_partner_model.id"
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Non Admin Dashboard"
          code: "DASH-SAVE-LAYOUT-NONADMIN-01"
      - step: "Create item"
        action: "create"
        model: "dashboard.item"
        save_as: "item"
        values:
          name: "Item A"
          dashboard_id: "REC: dashboard.id"
          type: "placeholder"
          data_source_id: "REC: data_source.id"
      - step: "Create a plain dashboard user (not administrator)"
        action: "create"
        model: "res.users"
        save_as: "dashboard_user"
        values:
          name: "Dashboard User"
          login: "dashboard-user-save-layout@example.com"
          group_ids:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_dashboard.group_dashboard_user"
      - step: "Non admin user saving the layout must be rejected"
        action: "call"
        target: "dashboard"
        method: "save_layout"
        as_user: "dashboard_user"
        expect_error:
          type: "UserError"
        args:
          - - id: "REC: item.id"
              column_start: 1
              row_start: 1
              column_width: 4
              row_height: 1
