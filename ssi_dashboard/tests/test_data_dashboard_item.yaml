      - step: "Create dashboard for items"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Item Test Dashboard"
          code: "DASH-ITEM-DASH-09"
      - step: "Get USD currency"
        action: "ref"
        xml_id: "base.USD"
        save_as: "usd"
      - step: "Create item with monetary unit type"
        action: "create"
        model: "dashboard.item"
        save_as: "item"
        values:
          name: "Item Monetary Unit"
          dashboard_id: "REC: dashboard.id"
          type: "placeholder"
          data_source_id: "REC: data_source.id"
          unit_type: "monetary"
          currency_id: "REC: usd.id"
      - step: "Open item in a form and switch unit_type to custom"
        action: "form"
        target: "item"
        save: false
        ops:
          - set: {unit_type: "custom"}
          - assert:
              currency_id:
                type: "value"
                operator: "is_falsy"

