          model_id: "REC: res_partner_model.id"
      - step: "Create dashboard for items"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Item Test Dashboard"
          code: "DASH-ITEM-DASH-06"
      - step: "Create item with a first dated goal row"
        action: "create"
        model: "dashboard.item"
        save_as: "item"
        values:
          name: "Item With Overlapping Goals"
          dashboard_id: "REC: dashboard.id"
          type: "placeholder"
          data_source_id: "REC: data_source.id"
          goal_type: "dated"
          goal_ids:
            - - 0
              - 0
              - date_start: "2026-01-01"
                date_end: "2026-01-31"
                value: 500
      - step: "Add a second goal row overlapping the first must be rejected"
        action: "create"
        model: "dashboard.item.goal"
        expect_error:
          type: "ValidationError"
        values:
          item_id: "REC: item.id"
          date_start: "2026-01-15"
          date_end: "2026-02-15"
          value: 700

