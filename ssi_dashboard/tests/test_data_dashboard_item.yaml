      - step: "Create dashboard for items"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Item Test Dashboard"
          code: "DASH-ITEM-DASH-05"
      - step: "Create item with goal_type dated but no goal rows"
        action: "create"
        model: "dashboard.item"
        expect_error:
          type: "ValidationError"
        values:
          name: "Item Dated Without Goals"
          dashboard_id: "REC: dashboard.id"
          type: "placeholder"
          data_source_id: "REC: data_source.id"
