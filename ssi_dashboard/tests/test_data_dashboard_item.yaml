          multiplier:
            type: "value"
            expected: 1.0
          number_format:
            type: "value"
            expected: "exact"
          precision_digits:
            type: "value"
            expected: 2
          unit_type:
            type: "value"
            expected: "none"

  - name: "Changing Unit Type From Monetary To Custom Clears Currency"
    steps:
      - step: "Create data source for items"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
