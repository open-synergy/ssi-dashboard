scenarios:
  - name: "Create Chart Item on an ORM-sourced Dashboard"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Create ORM data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DASH-CHART-DS-01"
          type: "orm"
          model_id: "REC: res_partner_model.id"
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Chart Dashboard"
          code: "DASH-CHART-01"
      - step: "Create chart item"
        action: "create"
        model: "dashboard.item"
        save_as: "item"
        values:
          name: "Partner Count by Country"
          dashboard_id: "REC: dashboard.id"
          type: "chart"
          data_source_id: "REC: data_source.id"
          config: '{"group_by": "country_id"}'
      - step: "Assert item type is chart"
        action: "assert"
        target: "item"
        asserts:
          type:
            type: "value"
            expected: "chart"

  - name: "Rendering a Chart Item With Invalid Config JSON Raises UserError"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Create ORM data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DASH-CHART-DS-02"
          type: "orm"
          model_id: "REC: res_partner_model.id"
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Chart Dashboard"
          code: "DASH-CHART-02"
      - step: "Create chart item with invalid config"
        action: "create"
        model: "dashboard.item"
        save_as: "item"
        values:
          name: "Broken Chart"
          dashboard_id: "REC: dashboard.id"
          type: "chart"
          data_source_id: "REC: data_source.id"
          config: "{not valid json"
      - step: "Rendering payload raises UserError"
        action: "call"
        target: "item"
        method: "_prepare_render_payload"
        expect_error:
          type: "UserError"

  - name: "Rendering a Chart Item With Unsupported chart_type Raises UserError"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Create ORM data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DASH-CHART-DS-03"
          type: "orm"
          model_id: "REC: res_partner_model.id"
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Chart Dashboard"
          code: "DASH-CHART-03"
      - step: "Create chart item with unsupported chart_type"
        action: "create"
        model: "dashboard.item"
        save_as: "item"
        values:
          name: "Broken Chart Type"
          dashboard_id: "REC: dashboard.id"
          type: "chart"
          data_source_id: "REC: data_source.id"
          config: '{"chart_type": "radar", "group_by": "country_id"}'
      - step: "Rendering payload raises UserError"
        action: "call"
        target: "item"
        method: "_prepare_render_payload"
        expect_error:
          type: "UserError"
