scenarios:
  - name: "Create Chart Item Defaults chart_type and chart_show_legend"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Find country_id field on res.partner"
        action: "search"
        model: "ir.model.fields"
        domain: [["model", "=", "res.partner"], ["name", "=", "country_id"]]
        save_as: "group_by_field"
        limit: 1
      - step: "Create ORM data source with a Group By Field"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DASH-CHART-DS-01"
          type: "orm"
          model_id: "REC: res_partner_model.id"
          group_by_field_id: "REC: group_by_field.id"
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Chart Dashboard"
          code: "DASH-CHART-01"
      - step: "Create chart item without setting chart_type"
        action: "create"
        model: "dashboard.item"
        save_as: "item"
        values:
          name: "Partner Count by Country"
          dashboard_id: "REC: dashboard.id"
          type: "chart"
          data_source_id: "REC: data_source.id"
      - step:
          "Assert chart_type/chart_show_legend and the new chart options all default"
        action: "assert"
        target: "item"
        asserts:
          type:
            type: "value"
            expected: "chart"
          chart_type:
            type: "value"
            expected: "bar"
          chart_show_legend:
            type: "value"
            expected: true
          chart_stacked:
            type: "value"
            expected: false
          chart_semi_circle:
            type: "value"
            expected: false
          chart_cumulative:
            type: "value"
            expected: false
          chart_data_label:
            type: "value"
            expected: "none"

  - name: "Chart Item On Data Source Without Group By Field Is Rejected"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Create ORM data source without a Group By Field"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DASH-CHART-DS-02"
          type: "orm"
          model_id: "REC: res_partner_model.id"
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Chart Dashboard"
          code: "DASH-CHART-02"
      - step: "Create chart item on a data source without Group By Field is rejected"
        action: "create"
        model: "dashboard.item"
        expect_error:
          type: "ValidationError"
        values:
          name: "Broken Chart"
          dashboard_id: "REC: dashboard.id"
          type: "chart"
          data_source_id: "REC: data_source.id"

  - name: "Chart Item Combining Multiple Measures With Sub Group By Field Is Rejected"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Find country_id field on res.partner"
        action: "search"
        model: "ir.model.fields"
        domain: [["model", "=", "res.partner"], ["name", "=", "country_id"]]
        save_as: "group_by_field"
        limit: 1
      - step: "Find company_type field on res.partner"
        action: "search"
        model: "ir.model.fields"
        domain: [["model", "=", "res.partner"], ["name", "=", "company_type"]]
        save_as: "sub_group_by_field"
        limit: 1
      - step: "Find a numeric field on res.partner (lowest id)"
        action: "search"
        model: "ir.model.fields"
        domain:
          [
            ["model", "=", "res.partner"],
            ["ttype", "in", ["integer", "float", "monetary"]],
          ]
        save_as: "numeric_field_a"
        order: "id asc"
        limit: 1
      - step: "Find a numeric field on res.partner (highest id)"
        action: "search"
        model: "ir.model.fields"
        domain:
          [
            ["model", "=", "res.partner"],
            ["ttype", "in", ["integer", "float", "monetary"]],
          ]
        save_as: "numeric_field_b"
        order: "id desc"
        limit: 1
      - step: "Create data source with Sub Group By Field and two Measures"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DASH-CHART-DS-03"
          type: "orm"
          model_id: "REC: res_partner_model.id"
          group_by_field_id: "REC: group_by_field.id"
          sub_group_by_field_id: "REC: sub_group_by_field.id"
          measure_ids:
            - - 0
              - 0
              - name: "Measure A"
                aggregate: "sum"
                field_id: "REC: numeric_field_a.id"
            - - 0
              - 0
              - name: "Measure B"
                aggregate: "sum"
                field_id: "REC: numeric_field_b.id"
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Chart Dashboard"
          code: "DASH-CHART-03"
      - step: "Create chart item combining multi-measure with sub group by is rejected"
        action: "create"
        model: "dashboard.item"
        expect_error:
          type: "ValidationError"
        values:
          name: "Broken Multi Measure Chart"
          dashboard_id: "REC: dashboard.id"
          type: "chart"
          data_source_id: "REC: data_source.id"

  - name: "Changing chart_type From Pie To Bar Resets chart_semi_circle"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Find country_id field on res.partner"
        action: "search"
        model: "ir.model.fields"
        domain: [["model", "=", "res.partner"], ["name", "=", "country_id"]]
        save_as: "group_by_field"
        limit: 1
      - step: "Create ORM data source with a Group By Field"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DASH-CHART-DS-04"
          type: "orm"
          model_id: "REC: res_partner_model.id"
          group_by_field_id: "REC: group_by_field.id"
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "Chart Dashboard"
          code: "DASH-CHART-04"
      - step: "Create chart item with chart_type pie and chart_semi_circle True"
        action: "create"
        model: "dashboard.item"
        save_as: "item"
        values:
          name: "Chart Item"
          dashboard_id: "REC: dashboard.id"
          type: "chart"
          data_source_id: "REC: data_source.id"
          chart_type: "pie"
          chart_semi_circle: true
      - step: "Switch chart_type to bar on the existing item via the Form API"
        action: "form"
        target: "item"
        ops:
          - assert:
              chart_semi_circle:
                type: "value"
                expected: true
          - set:
              chart_type: "bar"
          - assert:
              chart_semi_circle:
                type: "value"
                expected: false
        save: true

