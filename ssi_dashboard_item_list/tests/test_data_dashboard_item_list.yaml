scenarios:
  - name: "Create List Item on an ORM-sourced Dashboard"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Create ORM data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DASH-LIST-DS-01"
          type: "orm"
          model_id: "REC: res_partner_model.id"
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "List Dashboard"
          code: "DASH-LIST-01"
      - step: "Create list item"
        action: "create"
        model: "dashboard.item"
        save_as: "item"
        values:
          name: "Partner Table"
          dashboard_id: "REC: dashboard.id"
          type: "list"
          data_source_id: "REC: data_source.id"
          config: '{"columns": [{"key": "name"}, {"key": "amount", "label": "Amount"}]}'
      - step: "Assert item type is list"
        action: "assert"
        target: "item"
        asserts:
          type:
            type: "value"
            expected: "list"

  - name: "Rendering a List Item With Invalid Config JSON Raises UserError"
    steps:
      - step: "Get res.partner model"
