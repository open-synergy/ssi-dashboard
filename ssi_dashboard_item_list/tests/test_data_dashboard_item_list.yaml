        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "List Dashboard"
          code: "DASH-LIST-02"
      - step: "Create list item with invalid config"
        action: "create"
        model: "dashboard.item"
        save_as: "item"
        values:
          name: "Broken List"
          dashboard_id: "REC: dashboard.id"
          type: "list"
          data_source_id: "REC: data_source.id"
          config: "{not valid json"
      - step: "Rendering payload raises UserError"
        action: "call"
        target: "item"
        method: "_prepare_render_payload"
        expect_error:
          type: "UserError"

