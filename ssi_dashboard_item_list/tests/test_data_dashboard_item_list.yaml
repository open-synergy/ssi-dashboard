scenarios:
  - name: "Create List Item With Two Columns Defaults To Flat Mode And Page Size 10"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
      - step: "Create ORM data source"
        action: "create"
        model: "dashboard.data_source"
        save_as: "data_source"
        values:
          name: "Partners"
          code: "DASH-LIST-DS-01"
          type: "orm"
          model_id: "REC: res_partner_model.id"
      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "List Dashboard"
          code: "DASH-LIST-01"
      - step: "Create list item with two columns"
        action: "create"
        model: "dashboard.item"
        save_as: "item"
        values:
          name: "Partner Table"
          dashboard_id: "REC: dashboard.id"
          type: "list"
          data_source_id: "REC: data_source.id"
          column_ids:
            - - 0
              - 0
              - key: "name"
                name: "Name"
            - - 0
              - 0
              - key: "amount"
                name: "Amount"
                column_type: "number"
      - step: "Assert type, list_mode and page_size"
        action: "assert"
        target: "item"
        asserts:
          type:
            type: "value"
            expected: "list"
          list_mode:
            type: "value"
            expected: "flat"
          page_size:
            type: "value"
            expected: 10
          column_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

  - name: "Create List Item Without Columns Raises ValidationError"
    steps:
      - step: "Get res.partner model"
        action: "ref"
        xml_id: "base.model_res_partner"
        save_as: "res_partner_model"
