      - step: "Create dashboard"
        action: "create"
        model: "dashboard.dashboard"
        save_as: "dashboard"
        values:
          name: "List Dashboard"
          code: "DASH-LIST-02"
      - step: "Create list item without column_ids"
        action: "create"
        model: "dashboard.item"
        expect_error:
          type: "ValidationError"
        values:
          name: "No Columns List"
          dashboard_id: "REC: dashboard.id"
          type: "list"
          data_source_id: "REC: data_source.id"

